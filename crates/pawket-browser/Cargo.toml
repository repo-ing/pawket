[package]
name = "pawket-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlButtonElement", "HtmlAnchorElement", "Event", "EventTarget", "Node", "NodeList", "Request", "RequestInit", "RequestMode", "Response", "Headers", "Storage", "Location", "Navigator", "Clipboard", "Url", "AbortController", "AbortSignal", "console"] }

