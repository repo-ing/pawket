name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Tests
        run: cargo +stable test --workspace --locked
      - name: Lint
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint the browser UI (WebAssembly)
        run: cargo +stable clippy -p pawket-browser --target wasm32-unknown-unknown --locked -- -D warnings
