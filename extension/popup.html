<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="pawket-surface" content="extension" />
    <title>Pawket</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="bootstrap.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false"><symbol id="repocat" viewBox="0 0 96 96"><circle cx="48" cy="48" r="47" fill="#4bf8be" stroke="none"/><path fill="#000" stroke="none" d="M36.9 28.5L26.6 18.6Q24.2 15.9 22 18.6C19.6 24 17.6 31 16.6 37.5C15 40 12.9 44.5 12.9 50C12.9 58 17 65.4 25.4 72.8L22.4 80.2C28 85 38 87 48 87C58 87 68 85 73.6 80.2L70.6 72.8C79 65.4 83.1 58 83.1 50C83.1 44.5 81 40 79.4 37.5C78.4 31 76.4 24 74 18.6Q71.8 15.9 69.4 18.6L59.1 28.5Q48 29.6 36.9 28.5Z"/><g fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23.8 54.4A9 9 0 0 1 39.8 54.4"/><path d="M56.2 54.4A9 9 0 0 1 72.2 54.4"/></g><path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M42.4 60.4Q43.2 62.8 45.4 62.4Q47.2 62 48 60Q48.8 62 50.6 62.4Q52.8 62.8 53.6 60.4"/></symbol></svg>
    <div class="popup">
      <header>
        <div class="brand" aria-label="Pawket by repo.ing">
          <span class="mascot mascot-inline" id="repo-cat" data-mood="idle" aria-hidden="true"><svg class="mascot-svg" viewBox="0 0 96 96" focusable="false"><circle cx="48" cy="48" r="47" fill="#4bf8be" stroke="none"/><g class="mascot-head"><path fill="#000" stroke="none" d="M36.9 28.5L26.6 18.6Q24.2 15.9 22 18.6C19.6 24 17.6 31 16.6 37.5C15 40 12.9 44.5 12.9 50C12.9 58 17 65.4 25.4 72.8L22.4 80.2C28 85 38 87 48 87C58 87 68 85 73.6 80.2L70.6 72.8C79 65.4 83.1 58 83.1 50C83.1 44.5 81 40 79.4 37.5C78.4 31 76.4 24 74 18.6Q71.8 15.9 69.4 18.6L59.1 28.5Q48 29.6 36.9 28.5Z"/><g fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" class="mascot-eyes"><path d="M23.8 54.4A9 9 0 0 1 39.8 54.4"/><path d="M56.2 54.4A9 9 0 0 1 72.2 54.4"/></g><path class="mascot-mouth" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M42.4 60.4Q43.2 62.8 45.4 62.4Q47.2 62 48 60Q48.8 62 50.6 62.4Q52.8 62.8 53.6 60.4"/></g></svg></span>
          <span>Pawket</span><span class="brand-by">by <span class="repoing-wordmark" role="img" aria-label="repo.ing"></span></span>
        </div>
        <span class="engine-badge" id="engine-badge" data-state="checking">Checking…</span>
      </header>

      <main>
        <form id="inspect-form" aria-busy="false">
          <label class="field-label" for="url-input">Link to save</label>
          <div class="url-field">
            <svg viewBox="0 0 24 24" class="link-icon" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 .1l3-3a5 5 0 0 0-7-7l-2 2m3 6a5 5 0 0 0-7-.1l-3 3a5 5 0 0 0 7 7l2-2" /></svg>
            <input id="url-input" type="url" placeholder="Paste a link" autocomplete="off" spellcheck="false" required />
            <button id="paste-button" type="button" class="ghost-button">Paste</button>
          </div>
          <button id="inspect-button" class="primary-button" type="submit"><span data-button-label>Find media</span></button>
        </form>

        <p id="status" role="status" aria-live="polite" data-state="idle">Checking Pawket…</p>

        <section id="results" class="results" aria-labelledby="media-title" hidden>
          <h2 id="media-title"></h2>
          <div id="formats" class="formats" role="radiogroup" aria-label="Available files"></div>
          <p id="save-summary" class="save-summary" aria-live="polite" hidden></p>
          <button id="save-button" type="button" class="primary-button" hidden>Save file</button>
          <button id="save-all-button" type="button" class="secondary-button save-all" hidden><span data-button-label>Save all files</span></button>
        </section>
        <section id="jobs" class="jobs" hidden aria-label="Downloads">
          <ul id="jobs-list" class="jobs-list" aria-live="polite"></ul>
        </section>
      </main>

      <section class="connection">
        <button id="connection-toggle" type="button" class="connection-toggle" aria-expanded="false" aria-controls="connection-panel">
          <span>Connection</span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
        </button>
        <div id="connection-panel" hidden>
          <p class="connection-copy">Open the Pawket website, click <strong>Ready</strong> at the top right, and copy your pairing code.</p>
          <label class="field-label" for="api-base">Pawket address</label>
          <input class="settings-input" id="api-base" type="url" value="http://127.0.0.1:3987" autocomplete="off" spellcheck="false" />
          <label class="field-label" for="api-token">Pairing code</label>
          <input class="settings-input" id="api-token" type="password" placeholder="Paste the pairing code" autocomplete="off" spellcheck="false" />
          <p class="local-note">Your code stays on this computer.</p>
          <button id="save-connection" class="secondary-button" type="button">Save connection</button>
        </div>
      </section>
      <noscript>Pawket needs JavaScript turned on to work.</noscript>
    </div>
  </body>
</html>
